<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Vagabundo Barbería — Agenda tu cita</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Sometype+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============ CLICKUP™ DESIGN TOKENS ============ */
:root{
  /* Colors */
  --color-signal-white:#ffffff;
  --color-ink-black:#202020;
  --color-onyx:#090c1d;
  --color-carbon:#2a2a2a;
  --color-slate:#646464;
  --color-ash:#838383;
  --color-fog:#b3b3b3;
  --color-cloud:#d4d4d4;
  --color-bone:#e8e8e8;
  --color-mist:#f8f9fa;
  --color-plaster:#e9ebf0;
  --color-mercury:#eeeeee;
  --color-brand-violet:#6647f0;
  --color-signal-blue:#0091ff;
  --color-mint:#6ee7b7;
  --color-emerald:#00c07a;
  --color-teal-tag:#16c0a4;
  --color-danger:#e11d48;
  --color-warning:#d97706;

  /* Gradients */
  --gradient-rainbow-conic:conic-gradient(from 90deg, rgb(125, 91, 231) 19%, rgb(188, 63, 218) 28%, rgb(250, 36, 206) 37%, rgb(251, 73, 165) 45%, rgb(252, 109, 123) 52%, rgb(253, 132, 97) 55%, rgb(253, 154, 70) 58%, rgb(246, 135, 198) 65%, rgb(163, 160, 224) 80%, rgb(79, 185, 250) 95%, rgb(0, 145, 255) 100%);
  --gradient-primary:linear-gradient(83deg, rgb(64, 221, 255) -5%, rgb(118, 18, 250) 51%, rgb(250, 18, 227) 125%);
  --gradient-dark-fade:linear-gradient(rgb(17, 17, 17) 24%, rgb(0, 0, 0));

  /* Typography */
  --font-display:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-body:'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono:'Sometype Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Spacing (4px base) */
  --spacing-4:4px; --spacing-8:8px; --spacing-12:12px; --spacing-16:16px;
  --spacing-20:20px; --spacing-24:24px; --spacing-28:28px; --spacing-32:32px;
  --spacing-40:40px; --spacing-48:48px;

  /* Radii */
  --radius-inputs:9px;
  --radius-cards:12px;
  --radius-images:16px;
  --radius-largecards:20px;
  --radius-pill:9999px;

  /* Shadows */
  --shadow-subtle:rgba(0, 0, 0, 0.08) 0px 1px 3px 0px, rgba(0, 0, 0, 0.06) 0px 1px 2px -1px;
  --shadow-subtle-2:rgba(18, 43, 165, 0.04) 0px 1px 1px -0.5px, rgba(18, 43, 165, 0.04) 0px 3px 3px -1.5px, rgba(18, 43, 165, 0.04) 0px 6px 6px -3px, rgba(18, 43, 165, 0.05) 0px 12px 16px -6px;
  --shadow-sm:rgba(13, 21, 48, 0.04) 0px 4px 4px 0px;

  /* Layout */
  --page-max-width:1200px;
  --bottom-nav-height:68px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  min-height:100dvh;
  background:var(--color-signal-white);
  color:var(--color-ink-black);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  letter-spacing:-0.01em;
  font-feature-settings:"calt" 0, "clig" 0, "liga" 0;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  padding-bottom:calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px) + 16px);
}
h1,h2,h3,h4,p,dl,dd{margin:0;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-display);cursor:pointer;}
ul{list-style:none;margin:0;padding:0;}
input,textarea,select{font-family:var(--font-body);font-size:15px;}

/* ============ UTILIDADES Y TIPOGRAFÍA ============ */
.container{width:100%;max-width:var(--page-max-width);margin:0 auto;padding:0 var(--spacing-24);}

.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:500;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--color-ash);
}
.eyebrow--violet{color:var(--color-brand-violet);}

.lead{
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  color:var(--color-slate);
  max-width:58ch;
}
.display{
  font-family:var(--font-display);
  font-size:clamp(38px, 6vw, 68px);
  font-weight:800;
  line-height:1.05;
  letter-spacing:-0.04em;
  color:var(--color-onyx);
  font-feature-settings:"calt" 0;
}
.display-accent{
  background:var(--gradient-primary);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.heading-lg{
  font-family:var(--font-display);
  font-size:clamp(26px, 3.8vw, 42px);
  font-weight:800;
  line-height:1.12;
  letter-spacing:-0.035em;
  color:var(--color-onyx);
  font-feature-settings:"calt" 0;
}
.heading{
  font-family:var(--font-display);
  font-size:clamp(19px, 2.2vw, 24px);
  font-weight:700;
  line-height:1.22;
  letter-spacing:-0.025em;
  color:var(--color-ink-black);
}

/* ============ PANTALLAS SEPARADAS ============ */
.app-screen{
  display:none;
  padding:20px 0 24px;
}
.app-screen.is-active{
  display:block;
  animation:screenIn .28s cubic-bezier(0.33, 1, 0.68, 1) both;
}
.app-screen--hero{padding:24px 0 32px;}
@keyframes screenIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:none;}
}

.screen-top-bar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:var(--spacing-20);
}
.screen-top-bar .heading-lg{margin:4px 0;}

.reserva-slim-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:var(--spacing-12);
}

.nav-pill-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-display);
  font-size:13px;font-weight:700;color:var(--color-carbon);
  background:var(--color-signal-white);
  border:1px solid var(--color-bone);
  padding:6px 14px;
  border-radius:var(--radius-pill);
  transition:.15s;
}
.nav-pill-btn:hover{background:rgba(0,0,0,0.04);border-color:var(--color-cloud);}

/* ============ ANNOUNCE & HEADER ============ */
.announce{
  background:var(--color-ink-black);
  color:var(--color-signal-white);
  text-align:center;
  padding:8px var(--spacing-16);
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.05em;
}
.announce[hidden]{display:none !important;}

.site-header{
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--color-bone);
  position:sticky;top:0;z-index:50;
}
.header-inner{
  max-width:var(--page-max-width);
  margin:0 auto;
  padding:0 var(--spacing-24);
  height:56px;
  display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-16);
}
.wordmark{
  font-family:var(--font-display);
  font-weight:800;font-size:18px;letter-spacing:-0.03em;
  color:var(--color-onyx);
  display:inline-flex;align-items:center;gap:8px;
  background:none;border:0;padding:0;
}
.wordmark-dot{
  width:10px;height:10px;border-radius:var(--radius-pill);
  background:var(--color-brand-violet);
  display:inline-block;flex-shrink:0;
}
.wordmark span.wordmark-sub{color:var(--color-slate);font-weight:600;}
.wordmark img{height:30px;width:auto;}

.header-cta{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-display);
  font-size:13px;font-weight:700;
  color:var(--color-signal-white);
  background:var(--color-ink-black);
  padding:8px 16px;
  border-radius:var(--radius-pill);
  border:0;
  transition:.15s;
}
.header-cta:hover{background:#333333;}

/* ============ PANTALLA 1: HERO (CLICKUP STYLE) ============ */
.hero-split{
  display:grid;
  grid-template-columns:minmax(0, 1.08fr) minmax(0, 0.92fr);
  gap:var(--spacing-40);
  align-items:center;
  min-height:calc(100dvh - 150px);
}
.hero-pill-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 12px;
  border-radius:var(--radius-pill);
  background:var(--color-mist);
  border:1px solid var(--color-bone);
  font-family:var(--font-mono);
  font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--color-brand-violet);
  margin-bottom:var(--spacing-16);
}
.hero-pill-badge::before{
  content:'';width:7px;height:7px;border-radius:50%;
  background:var(--color-brand-violet);
}
.hero-copy .display{margin-bottom:var(--spacing-16);}
.hero-copy .lead{font-size:16px;margin-bottom:var(--spacing-20);}

/* Checkmark list (ClickUp style) */
.hero-checks{
  display:flex;flex-direction:column;gap:8px;
  margin-bottom:var(--spacing-28);
}
.hero-checks li{
  display:flex;align-items:flex-start;gap:10px;
  font-size:14.5px;color:var(--color-slate);
}
.hero-checks svg{
  width:18px;height:18px;flex-shrink:0;margin-top:2px;
  stroke:var(--color-signal-blue);fill:none;stroke-width:2.4;
}
.hero-checks strong{
  font-family:var(--font-display);
  color:var(--color-ink-black);font-weight:700;
}

/* Signature Animated Conic-Gradient Border (1 per page) */
.hero-actions{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;
}
.conic-cta-wrap{
  position:relative;
  display:inline-flex;
  padding:2px;
  border-radius:var(--radius-pill);
  overflow:hidden;
  isolation:isolate;
}
.conic-cta-wrap::before{
  content:'';
  position:absolute;
  inset:-120%;
  background:var(--gradient-rainbow-conic);
  animation:conicSpin 2.6s linear infinite;
  z-index:-1;
}
@keyframes conicSpin{
  to{transform:rotate(360deg);}
}
.conic-cta-inner{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 26px;
  background:var(--color-ink-black);
  color:var(--color-signal-white);
  border:0;
  border-radius:var(--radius-pill);
  font-family:var(--font-display);
  font-size:14.5px;font-weight:700;
  transition:background .15s;
}
.conic-cta-inner:hover{background:#2d2d2d;}

/* Hero Product UI Preview Card (ClickUp style) */
.hero-ui-card{
  background:var(--color-signal-white);
  border:1px solid var(--color-bone);
  border-radius:var(--radius-images);
  box-shadow:var(--shadow-subtle-2);
  overflow:hidden;
}
.hero-ui-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:var(--color-mist);
  border-bottom:1px solid var(--color-bone);
}
.hero-ui-title{
  font-family:var(--font-mono);font-size:11px;color:var(--color-ash);
  letter-spacing:0.06em;text-transform:uppercase;
}
.hero-ui-body{padding:18px;display:flex;flex-direction:column;gap:12px;}
.hero-ui-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;
  border-radius:var(--radius-cards);
  border:1px solid var(--color-bone);
  background:var(--color-signal-white);
}
.hero-ui-row-left{display:flex;align-items:center;gap:10px;min-width:0;}
.avatar-cluster{display:flex;align-items:center;}
.avatar-mini{
  width:28px;height:28px;border-radius:var(--radius-pill);
  border:2px solid var(--color-signal-white);
  display:grid;place-items:center;
  font-family:var(--font-display);font-size:10px;font-weight:700;color:#fff;
  background:var(--color-ink-black);
}
.avatar-mini + .avatar-mini{margin-left:-8px;}
.avatar-mini--violet{background:var(--color-brand-violet);}
.avatar-mini--blue{background:var(--color-signal-blue);}
.avatar-mini--teal{background:var(--color-teal-tag);}

.ui-row-title{font-family:var(--font-display);font-size:13.5px;font-weight:700;color:var(--color-ink-black);display:block;}
.ui-row-sub{font-size:12px;color:var(--color-ash);display:block;}

.status-pill{
  font-family:var(--font-mono);
  font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:var(--radius-pill);white-space:nowrap;
}
.status-pill--mint{background:var(--color-mint);color:#064e3b;}
.status-pill--blue{background:var(--color-signal-blue);color:#fff;}
.status-pill--violet{background:rgba(102,71,240,.12);color:var(--color-brand-violet);}
.status-pill--danger{background:rgba(225,29,72,.1);color:var(--color-danger);}
.status-pill--warn{background:#fef3c7;color:#92400e;}
.status-pill--muted{background:var(--color-mercury);color:var(--color-ash);}

/* ============ PANTALLA 2: RESERVAS (LIMPIA SIN SECCIONES REDUNDANTES) ============ */
.booking-shell{
  background:var(--color-signal-white);
  border:1px solid var(--color-bone);
  border-radius:var(--radius-largecards);
  padding:clamp(16px, 2.5vw, 28px);
}
.step-panel{display:none;}
.step-panel.is-active{display:block;animation:panelIn .24s cubic-bezier(0.33, 1, 0.68, 1) both;}
@keyframes panelIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.panel-head{margin-bottom:var(--spacing-20);}
.panel-head .heading{margin:6px 0 4px;}
.panel-foot{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:var(--spacing-12);margin-top:var(--spacing-20);padding-top:var(--spacing-16);
  border-top:1px solid var(--color-bone);
}

.agenda-grid{
  display:grid;
  grid-template-columns:minmax(0, 1.05fr) minmax(0, 1fr);
  gap:var(--spacing-16);
  align-items:start;
}
.specialists-full-card{grid-column:1 / -1;}

.card{
  background:var(--color-signal-white);
  border:1px solid var(--color-bone);
  border-radius:var(--radius-cards);
  padding:var(--spacing-20);
}
.card--mist{background:var(--color-mist);}
.card-label{
  font-family:var(--font-mono);
  font-size:10.5px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--color-ash);margin-bottom:var(--spacing-4);
}
.card-sub{
  font-family:var(--font-display);
  font-size:15px;font-weight:700;color:var(--color-ink-black);
  margin-bottom:var(--spacing-12);text-transform:capitalize;
}
.card-sub.empty{color:var(--color-ash);font-family:var(--font-body);font-weight:400;text-transform:none;font-size:13.5px;}

/* Calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-12);margin-bottom:var(--spacing-12);}
.cal-month{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--color-ink-black);text-transform:capitalize;letter-spacing:-0.02em;}
.cal-nav{
  width:34px;height:34px;display:grid;place-items:center;
  background:var(--color-signal-white);color:var(--color-ink-black);
  border:1px solid var(--color-bone);border-radius:var(--radius-pill);font-size:15px;transition:.15s;
}
.cal-nav:hover:not(:disabled){border-color:var(--color-ink-black);background:var(--color-mist);}
.cal-nav:disabled{opacity:.3;cursor:not-allowed;}
.cal-grid{display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:5px;}
.cal-dow{
  font-family:var(--font-mono);font-size:10px;font-weight:500;
  letter-spacing:0.08em;text-transform:uppercase;color:var(--color-ash);
  text-align:center;padding-bottom:6px;
}
.day{
  position:relative;aspect-ratio:1;min-height:36px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:13.5px;font-weight:600;
  color:var(--color-ink-black);background:transparent;
  border:1px solid transparent;border-radius:var(--radius-inputs);transition:.15s;
}
.day:hover:not(:disabled):not(.is-selected){border-color:var(--color-signal-blue);background:#f3f9ff;}
.day:disabled{pointer-events:none;user-select:none;cursor:not-allowed;}
.day.is-off{color:var(--color-fog);opacity:.45;cursor:not-allowed;}
.day.is-full{
  color:var(--color-danger);
  background:rgba(225,29,72,.05);
  border-color:rgba(225,29,72,.18);
  text-decoration:line-through;
  opacity:.48;
  cursor:not-allowed;
}
.day.has-bookings:not(.is-selected):not(.is-full):not(.is-off)::before{content:'';position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--color-warning);}
.day.is-today::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--color-brand-violet);}
.day.is-selected{background:var(--color-ink-black);border-color:var(--color-ink-black);color:var(--color-signal-white);}
.cal-legend{
  display:flex;flex-wrap:wrap;gap:var(--spacing-12);
  margin-top:var(--spacing-12);padding-top:var(--spacing-12);
  border-top:1px solid var(--color-bone);font-size:11.5px;color:var(--color-slate);
}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
.dot--open{background:var(--color-ink-black);}
.dot--partial{background:var(--color-warning);}
.dot--today{background:var(--color-brand-violet);}
.dot--full{background:var(--color-danger);}
.dot--off{background:var(--color-cloud);}

/* Horarios */
.slots{display:grid;grid-template-columns:repeat(auto-fill, minmax(84px, 1fr));gap:6px;}
.slot{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:8px 6px;min-height:46px;
  font-family:var(--font-display);font-size:13.5px;font-weight:700;
  color:var(--color-ink-black);background:var(--color-signal-white);
  border:1px solid var(--color-bone);border-radius:var(--radius-inputs);transition:.15s;
}
.slot-sub{font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:0.03em;color:var(--color-ash);line-height:1.1;}
.slot:hover:not(:disabled):not(.is-selected){border-color:var(--color-signal-blue);background:#f3f9ff;}
.slot.is-taken{color:var(--color-fog);text-decoration:line-through;opacity:.55;cursor:not-allowed;background:var(--color-mist);border-color:var(--color-bone);}
.slot.is-taken .slot-sub{color:var(--color-danger);text-decoration:none;}
.slot.is-spec-busy:not(.is-taken){border-color:rgba(217,119,6,.45);background:#fffbeb;}
.slot.is-spec-busy:not(.is-selected) .slot-sub{color:var(--color-warning);}
.slot.is-selected{background:var(--color-ink-black);border-color:var(--color-ink-black);color:var(--color-signal-white);}
.slot.is-selected .slot-sub{color:var(--color-mint);}
.slots-empty{font-size:13.5px;color:var(--color-ash);grid-column:1 / -1;}

/* ============ TARJETAS DE ESPECIALISTAS (2 COLS MÓVIL -> HASTA 6 COLS PC) ============ */
.specialist-inline-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:8px;
}
@media (min-width:640px){ .specialist-inline-grid{grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;} }
@media (min-width:840px){ .specialist-inline-grid{grid-template-columns:repeat(4, minmax(0, 1fr));} }
@media (min-width:1040px){ .specialist-inline-grid{grid-template-columns:repeat(5, minmax(0, 1fr));} }
@media (min-width:1200px){ .specialist-inline-grid{grid-template-columns:repeat(6, minmax(0, 1fr));} }

.specialist{
  position:relative;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:8px;width:100%;height:100%;
  padding:14px 10px 12px;
  background:var(--color-signal-white);
  border:1px solid var(--color-bone);
  border-radius:var(--radius-cards);
  transition:border-color .15s, background .15s, transform .15s;
}
.specialist:hover:not(:disabled){
  border-color:var(--color-signal-blue);
  background:var(--color-mist);
  transform:translateY(-1px);
}
.specialist.is-selected{
  border-color:var(--color-ink-black);
  box-shadow:inset 0 0 0 1px var(--color-ink-black);
  background:var(--color-mist);
}
.specialist:disabled{opacity:.48;cursor:not-allowed;background:var(--color-mist);}

.spec-check-badge{
  position:absolute;top:8px;right:8px;
  width:18px;height:18px;border-radius:var(--radius-pill);
  background:var(--color-ink-black);color:var(--color-signal-white);
  display:grid;place-items:center;
  opacity:0;transform:scale(.6);transition:.16s;
}
.spec-check-badge svg{width:11px;height:11px;stroke:#fff;stroke-width:2.8;fill:none;}
.specialist.is-selected .spec-check-badge{opacity:1;transform:scale(1);}

.spec-avatar{
  width:46px;height:46px;flex-shrink:0;
  display:grid;place-items:center;border-radius:var(--radius-pill);
  background:var(--color-mercury);
  border:1px solid var(--color-bone);
  color:var(--color-ink-black);
  font-family:var(--font-display);font-size:14px;font-weight:800;
  transition:.15s;
}
.specialist.is-selected .spec-avatar{
  background:var(--color-brand-violet);
  border-color:var(--color-brand-violet);
  color:var(--color-signal-white);
}
.spec-info{display:flex;flex-direction:column;gap:2px;min-width:0;width:100%;}
.spec-name{font-family:var(--font-display);font-size:13.5px;font-weight:700;color:var(--color-ink-black);line-height:1.25;word-break:break-word;}
.spec-role{font-family:var(--font-body);font-size:11.5px;color:var(--color-ash);line-height:1.3;word-break:break-word;}

.spec-status-pill{
  margin-top:auto;
  font-family:var(--font-mono);
  font-size:9.5px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:var(--radius-pill);
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.spec-status-pill.available{background:rgba(110,231,183,.38);color:#065f46;}
.spec-status-pill.busy{background:rgba(225,29,72,.1);color:var(--color-danger);}
.spec-status-pill.off{background:var(--color-mercury);color:var(--color-ash);}

.step1-selection-banner{
  margin-top:var(--spacing-16);padding:12px 16px;border-radius:var(--radius-cards);
  background:var(--color-mist);border:1px solid var(--color-bone);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  font-size:13.5px;color:var(--color-slate);
}
.step1-selection-banner strong{color:var(--color-ink-black);}

/* ============ PASO 2: SERVICIOS Y MONEDA ============ */
.currency-bar{
  display:inline-flex;align-items:center;flex-wrap:wrap;gap:10px;
  margin-top:var(--spacing-12);padding:6px 12px;
  background:var(--color-mist);border:1px solid var(--color-bone);
  border-radius:var(--radius-pill);
}
.currency-label{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-ash);}
.currency-options{display:inline-flex;gap:3px;padding:2px;background:var(--color-signal-white);border:1px solid var(--color-bone);border-radius:var(--radius-pill);}
.currency-btn{padding:4px 12px;font-size:12px;font-weight:700;color:var(--color-slate);background:transparent;border:0;border-radius:var(--radius-pill);transition:.15s;}
.currency-btn.is-active{background:var(--color-ink-black);color:var(--color-signal-white);}

.service-list{border-top:1px solid var(--color-bone);}
.service-item{border-bottom:1px solid var(--color-bone);}
.service{
  display:grid;grid-template-columns:1fr auto auto auto;align-items:center;
  gap:var(--spacing-16);width:100%;padding:16px 12px;text-align:left;
  background:transparent;border:0;border-radius:var(--radius-cards);transition:.15s;
}
.service:hover,.service.is-selected{background:var(--color-mist);}
.service-name{display:block;font-family:var(--font-display);font-size:15.5px;font-weight:700;color:var(--color-ink-black);}
.service-desc{display:block;margin-top:2px;font-family:var(--font-body);font-size:13px;color:var(--color-slate);}
.service-dur{font-family:var(--font-mono);font-size:12px;color:var(--color-ash);white-space:nowrap;}
.service-price{font-family:var(--font-display);font-size:15.5px;font-weight:700;color:var(--color-ink-black);white-space:nowrap;}
.service-check{
  width:22px;height:22px;border-radius:var(--radius-pill);
  border:1.5px solid var(--color-cloud);
  display:inline-flex;align-items:center;justify-content:center;transition:.15s;
}
.service-check svg{width:12px;height:12px;stroke:#fff;stroke-width:2.8;fill:none;opacity:0;}
.service.is-selected .service-check{background:var(--color-ink-black);border-color:var(--color-ink-black);}
.service.is-selected .service-check svg{opacity:1;}

/* ============ PASO 3: RESUMEN + DATOS + GOOGLE CALENDAR ============ */
.reserva-grid{display:grid;grid-template-columns:minmax(0, .92fr) minmax(0, 1.08fr);gap:var(--spacing-20);align-items:start;}
.summary > div{display:flex;justify-content:space-between;align-items:baseline;gap:var(--spacing-16);padding:10px 0;border-bottom:1px solid var(--color-bone);}
.summary > div:last-child{border-bottom:0;padding-bottom:0;}
.summary dt{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-ash);}
.summary dd{font-family:var(--font-display);font-size:14.5px;font-weight:700;color:var(--color-ink-black);text-align:right;}

.field{display:block;margin-bottom:var(--spacing-16);}
.field-label{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;
  color:var(--color-slate);margin-bottom:6px;
}
.field-req,.field-optional{font-style:normal;font-size:9.5px;padding:2px 8px;border-radius:var(--radius-pill);}
.field-req{color:var(--color-brand-violet);background:rgba(102,71,240,.1);}
.field-optional{color:var(--color-ash);background:var(--color-mercury);}
.field input,.field select{
  width:100%;padding:10px 12px;color:var(--color-ink-black);
  background:var(--color-signal-white);border:1px solid var(--color-cloud);
  border-radius:var(--radius-inputs);transition:.15s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--color-signal-blue);box-shadow:0 0 0 3px rgba(0,145,255,.12);}
.field-error{display:block;margin-top:4px;font-size:12px;font-weight:600;color:var(--color-danger);}
.field-error[hidden]{display:none;}

.gcal-opt-box{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;margin:16px 0;
  background:var(--color-mist);border:1px solid var(--color-bone);border-radius:var(--radius-cards);
  cursor:pointer;transition:.15s;
}
.gcal-opt-box:hover{border-color:var(--color-signal-blue);}
.gcal-opt-box input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--color-ink-black);cursor:pointer;flex-shrink:0;}
.gcal-opt-title{font-family:var(--font-display);font-size:13.5px;font-weight:700;color:var(--color-ink-black);}
.gcal-opt-sub{font-size:12px;color:var(--color-slate);margin-top:2px;line-height:1.4;}

.saved-profile-banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:9px 12px;margin-bottom:14px;border-radius:var(--radius-inputs);
  background:rgba(102,71,240,.06);border:1px solid rgba(102,71,240,.2);
  font-size:12px;color:var(--color-brand-violet);font-weight:600;
}
.saved-profile-banner[hidden]{display:none !important;}
.saved-profile-clear{border:0;background:transparent;color:var(--color-ink-black);font-size:12px;font-weight:700;text-decoration:underline;padding:2px 4px;}
.saved-profile-clear:hover{color:var(--color-danger);}

/* ============ BOTONES (ESTILO CLICKUP 9999px PILL) ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--font-display);font-size:14px;font-weight:700;
  min-height:42px;padding:10px 22px;
  border:1px solid transparent;border-radius:var(--radius-pill);
  transition:.15s;white-space:nowrap;
}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.btn-pill{background:var(--color-ink-black);color:var(--color-signal-white);border-color:var(--color-ink-black);}
.btn-pill:hover:not(:disabled){background:#343434;}
.btn-ghost{background:transparent;color:var(--color-ink-black);border-color:var(--color-bone);}
.btn-ghost:hover:not(:disabled){border-color:var(--color-ink-black);background:var(--color-mist);}
.btn-blue-outline{background:transparent;color:var(--color-signal-blue);border-color:var(--color-signal-blue);}
.btn-blue-outline:hover:not(:disabled){background:rgba(0,145,255,.07);}
.btn-danger{background:var(--color-danger);color:#fff;border-color:var(--color-danger);}
.btn-danger:hover:not(:disabled){filter:brightness(.92);}
.btn-danger-ghost{background:transparent;color:var(--color-danger);border-color:rgba(225,29,72,.3);}
.btn-danger-ghost:hover:not(:disabled){background:var(--color-danger);color:#fff;border-color:var(--color-danger);}
.btn-sm{min-height:34px;padding:6px 14px;font-size:12.5px;}

/* ============ PANTALLA 3: HISTORIAL Y BOTONES COMPACTOS EN COLUMNAS ============ */
.history-list{display:grid;gap:var(--spacing-12);}
.history-card{padding:var(--spacing-16) var(--spacing-20);}
.history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px;}
.history-card-footer{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:8px;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--color-bone);
}
@media (min-width:640px){
  .history-card-footer{
    grid-template-columns:repeat(4, minmax(0, 1fr));
  }
}
.history-card-footer--single{
  grid-template-columns:minmax(0, max-content);
  justify-content:end;
}
.history-action-btn{
  min-height:32px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700;
  width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ============ PANTALLA 4: UBICACIÓN ============ */
.map-card{position:relative;display:block;height:360px;border:1px solid var(--color-bone);border-radius:var(--radius-images);overflow:hidden;background:var(--color-mist);}
.map-card iframe{width:100%;height:100%;border:0;filter:grayscale(.85);pointer-events:none;}
.map-cta{
  position:absolute;left:14px;bottom:14px;padding:9px 18px;
  font-family:var(--font-display);font-size:13px;font-weight:700;
  color:var(--color-signal-white);background:var(--color-ink-black);
  border-radius:var(--radius-pill);
}
.location-meta{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:12px;margin-top:16px;}
.location-meta > div{background:var(--color-mist);border:1px solid var(--color-bone);border-radius:var(--radius-cards);padding:16px 18px;}
.location-meta dd{margin-top:6px;font-size:14px;color:var(--color-ink-black);line-height:1.5;}

/* ============ PANTALLA 5: INFO (CON DARK FEATURE CARD) ============ */
.info-grid{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:var(--spacing-16);}
.info-card{
  background:var(--color-signal-white);
  border:1px solid var(--color-bone);
  border-radius:var(--radius-cards);
  padding:var(--spacing-20);
  display:flex;flex-direction:column;gap:14px;
}
.info-card--dark{
  background:var(--gradient-dark-fade);
  border-color:#242424;
  color:var(--color-signal-white);
  justify-content:space-between;
}
.info-card--dark .card-label{color:var(--color-mint);}
.info-card--dark .heading{color:var(--color-signal-white);}
.info-card--dark .lead{color:var(--color-fog);}
.info-card--dark .info-icon{background:rgba(255,255,255,.1);color:var(--color-signal-white);border-color:rgba(255,255,255,.15);}
.btn-light-pill{background:var(--color-signal-white);color:var(--color-ink-black);border-color:var(--color-signal-white);}
.btn-light-pill:hover{background:var(--color-mercury);}
.btn-dark-ghost{background:transparent;color:var(--color-signal-white);border-color:rgba(255,255,255,.28);}
.btn-dark-ghost:hover{background:rgba(255,255,255,.1);}

.info-card-head{display:flex;align-items:center;gap:12px;}
.info-icon{
  width:38px;height:38px;border-radius:10px;
  background:var(--color-mist);border:1px solid var(--color-bone);
  color:var(--color-ink-black);display:grid;place-items:center;flex-shrink:0;
}
.info-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}

.info-schedule-list{display:flex;flex-direction:column;gap:6px;}
.info-schedule-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 12px;border-radius:var(--radius-inputs);background:var(--color-mist);
  font-size:13.5px;
}
.info-schedule-row strong{font-family:var(--font-display);color:var(--color-ink-black);text-transform:capitalize;font-weight:700;}
.info-schedule-row span{font-family:var(--font-mono);font-size:12px;color:var(--color-ink-black);}
.info-schedule-row.is-closed span{color:var(--color-ash);}

.info-contact-list{display:flex;flex-direction:column;gap:10px;}
.info-contact-item{display:flex;flex-direction:column;gap:2px;}
.info-contact-item small{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-ash);}
.info-contact-item p,.info-contact-item a{font-size:14.5px;font-weight:600;color:var(--color-ink-black);}

.social-links-grid{display:flex;flex-direction:column;gap:8px;}
.social-link-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;border-radius:var(--radius-pill);
  background:var(--color-mist);border:1px solid var(--color-bone);
  font-family:var(--font-display);font-size:13.5px;font-weight:700;color:var(--color-ink-black);transition:.15s;
}
.social-link-row:hover{border-color:var(--color-signal-blue);color:var(--color-signal-blue);}

/* ============ MENÚ INFERIOR FIJO ESTILO APP ============ */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:80;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--color-bone);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
.bottom-nav-inner{
  max-width:640px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:4px;
}
.bottom-nav-btn{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:5px 4px;background:transparent;border:0;border-radius:var(--radius-cards);
  color:var(--color-ash);transition:color .15s;
}
.bottom-nav-btn:hover{color:var(--color-ink-black);}
.bn-icon-wrap{
  position:relative;width:44px;height:28px;border-radius:var(--radius-pill);
  display:grid;place-items:center;transition:background .16s;
}
.bn-icon-wrap svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.bn-label{font-family:var(--font-display);font-size:11px;font-weight:6
